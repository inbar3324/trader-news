name: recompute-reactions

on:
  schedule:
    # Nightly 03:30 UTC â€” incremental (only event_types with new occurrences in last 24h)
    - cron: "30 3 * * 1-5"
    # Saturday 05:00 UTC â€” full recompute of all event_types
    - cron: "0 5 * * 6"
  workflow_dispatch:
    inputs:
      full:
        description: "Full recompute (--full flag)"
        type: boolean
        default: false

jobs:
  recompute-reactions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Run recompute-reactions
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.full }}" = "true" ]; then ARGS="-- --full"; fi
          npm --workspace workers run recompute-reactions $ARGS
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
