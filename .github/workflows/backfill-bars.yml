name: backfill-bars

on:
  schedule:
    # Daily 04:00 UTC â€” catches new occurrences within 1 day so n=3 threshold is reached fast
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  backfill-bars:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm --workspace workers run backfill-bars
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          YAHOO_COOKIE: ${{ secrets.YAHOO_COOKIE }}
