name: poll-breaking

on:
  schedule:
    # Every 5 min during the NY morning data window: 08:30–11:00 ET = 12:30–15:00 UTC
    # (EDT/summer offset; GH cron is fixed UTC and can't follow DST — see note below).
    # 5 inputs needed for GH cron: minute hour day-of-month month day-of-week
    - cron: "30,35,40,45,50,55 12 * * 1-5"   # 12:30–12:55 UTC (08:30–08:55 ET)
    - cron: "*/5 13-14 * * 1-5"              # 13:00–14:55 UTC (09:00–10:55 ET)
    - cron: "0 15 * * 1-5"                   # 15:00 UTC (11:00 ET) closing tick
    # Stuck-row safety net: every hour at :30, Mon–Sat (Sunday skipped — no
    # US trading). Runs --stuck-only so no source fetch / no classifier —
    # only drains the Stage 2 backlog. Cheap when there's nothing stuck
    # (one Supabase query, 0 Gemini calls).
    - cron: "30 * * * 1-6"
  workflow_dispatch:

jobs:
  poll-breaking:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: poll-breaking
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Run poll-breaking
        run: |
          ARGS=""
          # Full pipeline for the three morning-window crons and manual triggers.
          # Only the hourly safety-net cron runs --stuck-only.
          if [ "${{ github.event.schedule }}" = "30 * * * 1-6" ]; then
            ARGS="-- --stuck-only"
          fi
          npm --workspace workers run poll-breaking $ARGS
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_KEY_WRITER: ${{ secrets.GEMINI_KEY_WRITER }}
          GEMINI_KEY_RESEARCHER: ${{ secrets.GEMINI_KEY_RESEARCHER }}
          GEMINI_KEY_3: ${{ secrets.GEMINI_KEY_3 }}
          GEMINI_KEY_4: ${{ secrets.TRADERNEWSKEY4 }}
          GEMINI_KEY_5: ${{ secrets.TRADERNEWSKEY5 }}
