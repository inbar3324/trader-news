name: Pull economic calendar

on:
  schedule:
    # Sunday 22:00 UTC + Wednesday 12:00 UTC (safety re-pull mid-week)
    - cron: "0 22 * * 0"
    - cron: "0 12 * * 3"
  workflow_dispatch: {}

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Run pull-calendar worker
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run worker:pull-calendar
